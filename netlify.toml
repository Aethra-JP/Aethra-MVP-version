[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"

# Send /api/* to the Python backend (replace the URL with your Vercel deployment).
# If you prefer calling the backend directly, delete this block and set VITE_API_URL instead.
[[redirects]]
  from = "/api/*"
  to = "https://YOUR-BACKEND.vercel.app/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
