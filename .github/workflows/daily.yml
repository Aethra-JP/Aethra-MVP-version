name: Daily Aethra job
# Creates alerts and digests, and touches the database so a free Supabase project does not pause.
on:
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch: {}
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Call the backend
        run: |
          curl --fail --silent --show-error --max-time 60 -X POST \
            "${{ secrets.BACKEND_URL }}/api/cron/run" \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}"
